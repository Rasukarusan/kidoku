name: DB Schema Verification

on:
  # main/master へのプッシュでスキーマが変更されたら Production DB に自動反映
  push:
    branches:
      - main
      - master
    paths:
      - "apps/web/prisma/schema.prisma"
      - "apps/api/prisma/schema.prisma"
  # PR でスキーマが変更されたら Preview DB に自動反映
  # （フォークからの PR は Secrets にアクセスできないため対象外）
  pull_request:
    branches:
      - main
      - master
    paths:
      - "apps/web/prisma/schema.prisma"
      - "apps/api/prisma/schema.prisma"
  workflow_dispatch:
    inputs:
      operation:
        description: "検査またはPreview限定の移行"
        type: choice
        default: verify
        options:
          - verify
          - migrate-preview
      backup_certificate:
        description: "バックアップ暗号化用の公開証明書（base64）"
        type: string
        required: false
      environment:
        description: "プッシュ先のデータベース環境"
        required: true
        default: "Production"
        type: choice
        options:
          - Production
          - Preview

# 同一環境のスキーマ確認を直列化する
concurrency:
  group: db-push-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event_name == 'pull_request' && 'Preview' || 'Production' }}
  cancel-in-progress: false

jobs:
  db-push:
    if: ${{ inputs.operation != 'migrate-preview' }}
    runs-on: ubuntu-latest
    # push(main/master) → Production / pull_request → Preview / 手動実行 → 選択した環境
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event_name == 'pull_request' && 'Preview' || 'Production' }}
    steps:
      # 自動実行時はトリガーとなったコミット、手動実行時は「Use workflow from」で選択したブランチのスキーマを使う
      - uses: actions/checkout@v4

      # web と api の Prisma スキーマが同期しているか確認（片方だけの変更を検出）
      - name: Check schema sync
        run: |
          if ! diff -u apps/web/prisma/schema.prisma apps/api/prisma/schema.prisma; then
            echo "::error::apps/web/prisma/schema.prisma と apps/api/prisma/schema.prisma が一致していません。両方のスキーマを同期してください。"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter web exec prisma generate
          pnpm --filter api exec prisma generate

      # The collection migration renames live tables and creates compatibility
      # views. `db push` would infer destructive drops and cannot manage the views.
      # Apply reviewed SQL during maintenance; CI only verifies the result.
      - name: Verify collection schema (read only)
        run: node scripts/verify-collection-schema.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'migrate-preview' && inputs.environment == 'Preview' }}
    runs-on: ubuntu-latest
    environment: Preview
    permissions:
      contents: read
    services:
      restore:
        image: mysql:9.3
        env:
          MYSQL_ROOT_PASSWORD: restore-verification-only
          MYSQL_DATABASE: restore_check
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prestore-verification-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_DIRECTORY: ${{ runner.temp }}/preview-backup
    steps:
      - name: Require backup certificate
        env:
          BACKUP_CERTIFICATE: ${{ inputs.backup_certificate }}
        run: test -n "$BACKUP_CERTIFICATE"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma generate
      - name: Preflight
        run: node scripts/migrate-collections.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Restrict preview API during maintenance
        run: gcloud run services update kidoku-api-preview --region asia-northeast1 --ingress internal
      - run: sudo apt-get update -qq && sudo apt-get install -y mysql-client
      - name: Backup and verify restoration
        run: node scripts/backup-preview-database.mjs
        env:
          RESTORE_DATABASE_URL: mysql://root:restore-verification-only@127.0.0.1:13306/restore_check
          BACKUP_CERTIFICATE: ${{ inputs.backup_certificate }}
      - name: Store encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: preview-database-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-backup/preview.sql.cms
          if-no-files-found: error
          retention-days: 30
      - name: Rehearse migration on restored backup
        run: |
          node scripts/migrate-collections.mjs --apply --writers-stopped --backup-verified
          node scripts/verify-collection-schema.mjs
        env:
          DATABASE_URL: mysql://root:restore-verification-only@127.0.0.1:13306/restore_check
      - name: Apply preview migration
        run: |
          node scripts/backup-preview-database.mjs --check-unchanged
          node scripts/migrate-collections.mjs --apply --writers-stopped --backup-verified
          node scripts/verify-collection-schema.mjs
      - name: Store migration progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-migration-progress-${{ github.run_id }}
          path: .collection-migration-progress.json
          if-no-files-found: ignore
      - name: Remove plaintext backup
        if: always()
        run: rm -f "$BACKUP_DIRECTORY/preview.sql"
